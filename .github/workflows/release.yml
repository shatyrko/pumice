name: Release
# Builds .deb, .rpm and AppImage when a tag like v0.2.0 is pushed.
on:
  push:
    tags: ['v*']

jobs:
  bundle:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config build-essential rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo build --release -p pumice-helper
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Pumice ${{ github.ref_name }}
          releaseBody: 'Install the .deb, the .rpm or the AppImage. The administrator helper (package removal, journal, trim) is installed with scripts/install-helper.sh.'
          releaseDraft: true
