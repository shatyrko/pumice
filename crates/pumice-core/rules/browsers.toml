[[rule]]
id = "firefox-cache"
name = "Firefox cache"
category = "browsers"
description = "Pages and pictures Firefox saved for later."
risk = "low"
paths = ["~/.cache/mozilla/firefox/*/cache2/*", "~/.cache/mozilla/firefox/*/startupCache/*"]
blocked_by = ["firefox", "firefox-bin"]
note = "Close Firefox first."

[[rule]]
id = "chrome-cache"
name = "Google Chrome cache"
category = "browsers"
description = "Pages, scripts and shaders Chrome saved for later."
risk = "low"
paths = ["~/.cache/google-chrome/*/Cache/*", "~/.cache/google-chrome/*/Code Cache/*", "~/.cache/google-chrome/*/GPUCache/*"]
blocked_by = ["chrome"]
note = "Close Chrome first."

