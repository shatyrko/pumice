[[rule]]
id = "recent-files"
name = "Recently used files"
category = "privacy"
description = "The list of recent documents kept by GTK and KDE applications."
risk = "low"
paths = ["~/.local/share/recently-used.xbel", "~/.local/share/RecentDocuments/*"]
