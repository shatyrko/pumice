[[rule]]
id = "firefox-privacy"
name = "Firefox cookies and form history"
category = "privacy"
description = "Cookies, saved form entries and the last session. Bookmarks, passwords and browsing history are not touched."
risk = "medium"
paths = [
  "~/.mozilla/firefox/*/cookies.sqlite*", "~/.mozilla/firefox/*/formhistory.sqlite*",
  "~/.mozilla/firefox/*/sessionstore-backups/*", "~/.mozilla/firefox/*/sessionstore.jsonlz4",
]
blocked_by = ["firefox", "firefox-bin"]
note = "You will be signed out of websites. Close Firefox first."

[[rule]]
id = "chrome-privacy"
name = "Chrome history and cookies"
category = "privacy"
description = "Browsing history, cookies and top sites. Passwords, bookmarks and autofill are not touched."
risk = "medium"
paths = [
  "~/.config/google-chrome/*/History*", "~/.config/google-chrome/*/Cookies*",
  "~/.config/google-chrome/*/Top Sites*", "~/.config/google-chrome/*/Visited Links",
  "~/.config/google-chrome/*/Shortcuts*", "~/.config/google-chrome/*/Network Action Predictor*",
]
blocked_by = ["chrome"]
note = "You will be signed out of websites. Close Chrome first."

