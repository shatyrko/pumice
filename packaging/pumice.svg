<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#1f6f68"/>
      <stop offset="0.55" stop-color="#13434a"/>
      <stop offset="1" stop-color="#0b2430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.22" r="0.8">
      <stop offset="0" stop-color="#7fe3cc" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fe3cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fbf7ef"/>
      <stop offset="0.6" stop-color="#e3dccd"/>
      <stop offset="1" stop-color="#b8ae9b"/>
    </linearGradient>
    <linearGradient id="pore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d836f"/>
      <stop offset="1" stop-color="#cfc6b3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- soft ring, like a disk platter -->
    <circle cx="256" cy="262" r="196" fill="none" stroke="#7fe3cc" stroke-opacity="0.16" stroke-width="3"/>
    <circle cx="256" cy="262" r="164" fill="none" stroke="#7fe3cc" stroke-opacity="0.10" stroke-width="2"/>
  </g>
  <!-- stone shadow -->
  <ellipse cx="262" cy="404" rx="148" ry="22" fill="#031017" opacity="0.55" filter="url(#shadow)"/>
  <!-- stone -->
  <path d="M104 296c-10-70 30-136 102-160 62-21 138-2 174 50 33 48 25 118-20 156-48 41-132 50-194 25-38-15-57-40-62-71z" fill="url(#stone)"/>
  <path d="M112 262c10-60 52-108 112-122" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="7" stroke-linecap="round"/>
  <!-- pores: dark top edge, light bottom edge -->
  <g>
    <g transform="translate(210 218)"><circle r="21" fill="url(#pore)"/><circle r="16" cy="3" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(304 190)"><circle r="14" fill="url(#pore)"/><circle r="10" cy="2" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(344 268)"><circle r="23" fill="url(#pore)"/><circle r="17" cy="3" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(246 322)"><circle r="16" fill="url(#pore)"/><circle r="11" cy="2" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(163 304)"><circle r="12" fill="url(#pore)"/><circle r="8" cy="2" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(300 352)"><circle r="12" fill="url(#pore)"/><circle r="8" cy="2" fill="#a79d89" opacity="0.55"/></g>
    <g transform="translate(266 256)"><circle r="9" fill="url(#pore)"/></g>
    <g transform="translate(380 214)"><circle r="8" fill="url(#pore)"/></g>
    <g transform="translate(188 258)"><circle r="7" fill="url(#pore)"/></g>
  </g>
  <!-- sparkles -->
  <g fill="#aef5e2">
    <path d="M392 86l10 26 26 10-26 10-10 26-10-26-26-10 26-10z"/>
    <path d="M122 120l6 15 15 6-15 6-6 15-6-15-15-6 15-6z" fill-opacity="0.85"/>
    <path d="M430 176l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill-opacity="0.7"/>
  </g>
</svg>
